name: Backfill Code Formatting

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install gcc and clang-format
        run: sudo apt-get update && sudo apt-get install -y build-essential clang-format

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Reformat past code questions
        run: python scripts/backfill_format.py

      - name: Rebuild GitHub Pages site
        run: python scripts/build_site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/questions docs
          git diff --cached --quiet || git commit -m "chore: 과거 코드 문제 포맷 정리"
          git push
