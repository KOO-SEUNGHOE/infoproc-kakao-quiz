name: Daily Quiz

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 07:00 KST (KST = UTC+9 → UTC 기준 전날 22:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install gcc and clang-format
        run: sudo apt-get update && sudo apt-get install -y build-essential clang-format

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate & verify today's questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          NUM_QUESTIONS: ${{ vars.NUM_QUESTIONS }}
        run: python scripts/generate_questions.py

      - name: Build GitHub Pages site
        run: python scripts/build_site.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/questions docs
          git diff --cached --quiet || git commit -m "chore: 오늘의 문제 추가 ($(date +%F))"
          git push

      - name: Send KakaoTalk memo
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_kakao.py
